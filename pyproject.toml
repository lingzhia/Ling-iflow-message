[project]
name = "ling-iflow"
version = "0.1.0"
description = "Ling-iflow - iflow CLI 交互模式管理工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
# 开发依赖
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

# 企业微信依赖
wechat = [
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
    "cryptography>=41.0.0",
]

# 飞书依赖
feishu = [
    "lark-oapi>=1.0.0",
    "httpx>=0.24.0",
]

# 全部功能
all = [
    "ling-iflow[wechat,feishu,dev]",
]

[project.scripts]
ling-iflow = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]