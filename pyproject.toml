[project]
name = "ling-iflow"
version = "0.1.0"
description = "Ling-iflow - iflow CLI 交互模式管理工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
wechat = [
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
    "cryptography>=41.0.0",
]

[project.scripts]
ling-iflow = "cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["channels", "cli", "config", "interactive", "utils"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]